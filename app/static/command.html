<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>Command Center</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050b14; --panel:rgba(9,24,40,.72); --line:rgba(25,211,255,.22); --line-hi:rgba(25,211,255,.55);
  --cyan:#19d3ff; --teal:#2ef2c8; --amber:#ffb020; --red:#ff4d5e; --violet:#8a7dff;
  --ink:#d6f2ff; --mute:#6f93a8; --glow:0 0 18px rgba(25,211,255,.18);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:
    radial-gradient(1200px 600px at 50% -10%,rgba(25,211,255,.10),transparent 60%),
    linear-gradient(rgba(25,211,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(25,211,255,.04) 1px,transparent 1px);
  background-size:auto,44px 44px,44px 44px;background-attachment:fixed}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
/* sidebar */
nav.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:rgba(5,11,20,.6);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;letter-spacing:.18em;font-size:12px;color:var(--cyan);text-transform:uppercase}
.brand i{width:26px;height:26px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;box-shadow:var(--glow)}
.brand i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:13px;border:1px solid transparent}
nav.side a:hover,nav.side a.on{color:var(--ink);background:rgba(25,211,255,.08);border-color:var(--line)}
nav.side a b{margin-left:auto;font:600 11px var(--mono);color:var(--cyan)}
.side .foot{margin-top:auto;font:11px var(--mono);color:var(--mute);padding:8px}
/* main */
main{padding:16px 20px 28px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:inline-flex;gap:8px;align-items:center}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.chip.warn .d{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chip.demo{color:var(--amber);border-color:rgba(255,176,32,.45)}
.clock{margin:0 auto;text-align:center}
.clock .t{font:600 24px var(--mono);letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 14px rgba(25,211,255,.5)}
.clock .dt{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.btn{cursor:pointer;border:1px solid var(--line-hi);background:rgba(25,211,255,.10);padding:8px 14px;border-radius:7px;font-size:13px}
.btn:hover{background:rgba(25,211,255,.2)}
.btn.ghost{border-color:var(--line);background:none;color:var(--mute)}
/* grid */
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;backdrop-filter:blur(4px);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--cyan);opacity:.7}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph h2{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.ph span{font:11px var(--mono);color:var(--mute)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
/* core */
.coreBox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-top:18px;padding-bottom:16px}
.core{position:relative;width:min(300px,70vw);aspect-ratio:1}
.core .r{position:absolute;inset:0;border-radius:50%;border:1px solid transparent}
.core .r1{border-top-color:var(--cyan);border-bottom-color:rgba(25,211,255,.25);animation:spin 18s linear infinite}
.core .r2{inset:12%;border-left-color:var(--teal);border-right-color:rgba(46,242,200,.2);animation:spin 11s linear infinite reverse}
.core .r3{inset:24%;border:1px dashed rgba(25,211,255,.4);animation:spin 40s linear infinite}
.core .orb{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff4ff,#19d3ff 35%,#0a5b86 70%,#06223a);box-shadow:0 0 50px rgba(25,211,255,.55),inset 0 0 25px rgba(0,0,0,.4);animation:pulse 3.6s ease-in-out infinite}
.core.warn .orb{background:radial-gradient(circle at 35% 30%,#ffe7b0,#ffb020 35%,#8a5a00 70%,#2a1a00);box-shadow:0 0 50px rgba(255,176,32,.5),inset 0 0 25px rgba(0,0,0,.4)}
.core .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 10px var(--mono);letter-spacing:.14em;color:#031018;text-shadow:0 0 6px rgba(255,255,255,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.15)}}
.greet{text-align:center}
.greet h1{font:600 18px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.greet p{color:var(--mute);margin-top:4px;max-width:46ch}
.prio{width:100%;display:grid;gap:6px;margin-top:4px}
.prio div{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(25,211,255,.04)}
.prio b{font:700 12px var(--mono);color:var(--cyan)}
/* feed */
.feed{display:grid;gap:8px;max-height:430px;overflow:auto;padding-right:2px}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(25,211,255,.03)}
.item .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--mono);background:rgba(25,211,255,.14);color:var(--cyan)}
.item.high .ic{background:rgba(255,176,32,.16);color:var(--amber)}
.item.alert .ic{background:rgba(255,77,94,.16);color:var(--red)}
.item .tt{font-weight:600;font-size:13px}
.item .bd{color:var(--mute);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.item .ag{font:11px var(--mono);color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);font-size:13px;padding:8px 2px}
/* bots */
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bot{border:1px solid var(--line);border-radius:9px;padding:10px;background:rgba(25,211,255,.03)}
.bot .n{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);flex:none}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.idle{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.bot .m{font:11px var(--mono);color:var(--mute);margin-top:6px}
.tiles{display:grid;gap:4px;margin-top:8px}
.tile{display:flex;justify-content:space-between;font:12px var(--mono)}
.tile span{color:var(--mute)}.tile b{color:var(--ink)}
.up{color:var(--teal)}.dn{color:var(--red)}
/* timeline */
.tl{display:grid;gap:0;position:relative;padding-left:14px}
.tl::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--line-hi)}
.tl>div{position:relative;padding:5px 0 9px}
.tl>div::before{content:"";position:absolute;left:-14px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--cyan)}
.tl>div.done::before{background:var(--teal);border-color:var(--teal)}
.tl .tm{font:11px var(--mono);color:var(--cyan)}
.tl .tx{font-size:13px}.tl .nt{font-size:12px;color:var(--mute)}
/* commands */
form.cmd{display:grid;gap:8px}
.cmd input,.cmd select,.cmd textarea{width:100%;background:rgba(5,11,20,.7);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.cmd input:focus,.cmd select:focus,.cmd textarea:focus{outline:none;border-color:var(--cyan);box-shadow:var(--glow)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font:12px var(--mono);color:var(--mute);min-height:16px}
/* gauges */
.gauges{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.g{text-align:center}
.g svg{width:86px;height:86px;transform:rotate(-90deg)}
.g circle{fill:none;stroke-width:6}
.g .bg{stroke:rgba(25,211,255,.14)}
.g .fg{stroke:var(--cyan);stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(25,211,255,.7));transition:stroke-dashoffset .8s}
.g .v{position:relative;margin-top:-58px;height:30px;font:700 15px var(--mono)}
.g .l{margin-top:28px;font:11px var(--mono);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
/* activity bars */
.bars{margin-top:16px;display:grid;gap:8px}
.bars h3{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.bar{display:grid;grid-template-columns:96px 1fr 22px;gap:8px;align-items:center;font:12px var(--mono)}
.bar .tr{height:6px;border-radius:3px;background:rgba(25,211,255,.12);overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal));box-shadow:0 0 8px rgba(25,211,255,.6)}
.bar span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar b{text-align:right}
/* login overlay */
#login{position:fixed;inset:0;background:rgba(5,11,20,.94);display:none;place-items:center;z-index:9}
#login form{display:grid;gap:10px;width:min(320px,86vw);padding:22px;border:1px solid var(--line-hi);border-radius:12px;background:var(--panel)}
#login h2{font:600 13px var(--mono);letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;text-align:center}
#login input{background:rgba(5,11,20,.8);border:1px solid var(--line);border-radius:7px;padding:10px}
/* responsive */
@media (max-width:1100px){.c3,.c4,.c5,.c6,.c8{grid-column:span 12}.grid .coreCol{order:-1}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .brand,nav.side .foot{display:none}
  nav.side a{padding:6px 10px}
  main{padding:12px 12px 24px}
  .clock{order:3;flex-basis:100%;margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login"><form id="loginForm"><h2>Authenticate</h2><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn">Sign in</button><div class="msg" id="loginMsg"></div></form></div>
<div class="shell">
  <nav class="side">
    <div class="brand"><i></i>Command</div>
    <a class="on" href="#core">Command Center</a>
    <a href="#feed">Briefings <b id="navBriefs">0</b></a>
    <a href="#bots">Bots <b id="navBots">0</b></a>
    <a href="#timeline">Timeline</a>
    <a href="#tasks">Tasks <b id="navTasks">0</b></a>
    <div class="foot" id="foot">&nbsp;</div>
  </nav>
  <main>
    <div class="top">
      <span class="chip" id="sys"><span class="d"></span><span id="sysTxt">System status: …</span></span>
      <span class="chip demo" id="demoChip" hidden>Demo data</span>
      <div class="clock"><div class="t" id="clk">--:--:--</div><div class="dt" id="dt">&nbsp;</div></div>
      <button class="btn ghost" id="refresh" title="Refresh">Refresh</button>
      <button class="btn ghost" id="signout" hidden>Sign out</button>
    </div>
    <div class="grid">
      <section class="panel c3" id="bots"><div class="ph"><h2>Bot overview</h2><span id="botSub"></span></div><div class="bots" id="botList"></div></section>
      <section class="panel c6 coreCol coreBox" id="core">
        <div class="core" id="coreOrb"><div class="r r1"></div><div class="r r2"></div><div class="r r3"></div><div class="orb"></div><div class="lbl" id="coreLbl">ONLINE</div></div>
        <div class="greet"><h1 id="greet">Good morning</h1><p id="headline">Loading…</p></div>
        <div class="prio" id="prio"></div>
      </section>
      <section class="panel c3" id="feed"><div class="ph"><h2>Live feed</h2><span id="feedSub"></span></div><div class="feed" id="feedList"></div></section>

      <section class="panel c4"><div class="ph"><h2>System monitor</h2><span>live</span></div><div class="gauges" id="gauges"></div><div class="bars"><h3>Reports per bot (24 h)</h3><div id="barList"></div></div></section>
      <section class="panel c4" id="timeline"><div class="ph"><h2>Mission timeline</h2><span>today</span></div><div class="tl" id="tlList"></div></section>
      <section class="panel c4" id="tasks"><div class="ph"><h2>Quick commands</h2><span id="taskSub"></span></div>
        <form class="cmd" id="cmd">
          <select id="cmdBot"></select>
          <input id="cmdTitle" placeholder="Give a bot a task…" maxlength="200" required>
          <textarea id="cmdDetail" rows="2" placeholder="Details (optional)"></textarea>
          <div class="row"><button class="btn">Send task</button><span class="msg" id="cmdMsg"></span></div>
        </form>
        <div class="feed" id="taskList" style="margin-top:10px;max-height:190px"></div>
      </section>
    </div>
  </main>
</div>
<script>
"use strict";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = id => document.getElementById(id);
const el = (t, cls, text) => { const e = document.createElement(t); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ago = iso => { if (!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
const STALE_H = 26;

/* ---------- data sources ---------- */
function demoData() {
  const now = Date.now(), mins = n => new Date(now - n * 60000).toISOString();
  return {
    headline: "Three things need you today. Everything else is handled.",
    priorities: [
      ["Reply to Sam before noon", "inbox"], ["Move the 2 pm dentist, it clashes with the investor call", "chief-of-staff"], ["Approve tomorrow's 3 scheduled posts", "social"]],
    bots: [
      { name: "chief-of-staff", healthy: true, last: mins(14), open: 1, tiles: [["Meetings today", "3"], ["Conflicts", "1"]] },
      { name: "inbox", healthy: true, last: mins(32), open: 0, tiles: [["Unread", "12"], ["Urgent", "2"]] },
      { name: "social", healthy: true, last: mins(95), open: 2, tiles: [["Followers", "+42", "up"], ["Posts queued", "3"]] },
      { name: "fitness", healthy: true, last: mins(400), open: 0, tiles: [["Steps", "8,240"], ["Streak", "6d"]] },
      { name: "finance", healthy: false, last: mins(1700), open: 0, tiles: [["Cash flow", "On track"], ["Bills due", "2"]] },
    ],
    feed: [
      { bot: "inbox", priority: "high", title: "2 urgent replies waiting", body: "Sam (noon deadline) and the landlord.", at: mins(32) },
      { bot: "chief-of-staff", priority: "high", title: "Calendar conflict", body: "Dentist 2 pm overlaps the investor call.", at: mins(14) },
      { bot: "social", priority: "normal", title: "3 posts scheduled for tomorrow", body: "Reach is up 18% week on week.", at: mins(95) },
      { bot: "fitness", priority: "low", title: "6 day streak", body: "8,240 steps so far. Evening run suggested.", at: mins(400) },
      { bot: "finance", priority: "alert", title: "No update for over 24 hours", body: "The finance bot has not reported.", at: mins(1700) },
    ],
    timeline: [
      { at: "07:30", text: "Morning briefing delivered", note: "chief-of-staff", done: true },
      { at: "09:00", text: "Daily stand-up", note: "calendar", done: true },
      { at: "12:00", text: "Reply to Sam (deadline)", note: "inbox", done: false },
      { at: "14:00", text: "Investor call", note: "conflicts with dentist", done: false },
      { at: "18:00", text: "Evening run", note: "fitness", done: false }],
    tasks: [{ bot: "social", title: "Draft Friday's caption", status: "open" }, { bot: "chief-of-staff", title: "Reschedule dentist", status: "open" }, { bot: "inbox", title: "Summarise overnight email", status: "done" }],
    gauges: { online: 80, tasks: 33, fresh: 91 },
  };
}
function liveData(o) {
  const bots = o.bots.map(b => ({ name: b.bot, healthy: b.healthy, last: b.last_brief, open: b.open_tasks, tiles: [] }));
  const feed = o.briefs.map(b => ({ bot: b.bot, priority: b.kind === "alert" ? "alert" : b.priority, title: b.title, body: b.body, at: b.created_at }));
  const high = feed.filter(f => f.priority === "high" || f.priority === "alert").slice(0, 3);
  const quiet = bots.filter(b => !b.healthy).length;
  const doneN = o.tasks.filter(t => t.status === "done").length;
  const lastAt = Math.max(0, ...o.briefs.map(b => +new Date(b.created_at)));
  const fresh = lastAt ? Math.max(0, Math.round(100 - ((Date.now() - lastAt) / 36e5) / STALE_H * 100)) : 0;
  const act = [...o.briefs.map(b => ({ t: +new Date(b.created_at), text: b.title, note: b.bot, done: true })),
               ...o.tasks.map(t => ({ t: +new Date(t.completed_at || t.created_at), text: t.title, note: t.bot + " · task", done: t.status === "done" }))]
    .sort((a, b) => b.t - a.t).slice(0, 6).map(x => ({ at: new Date(x.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), text: x.text, note: x.note, done: x.done }));
  return {
    headline: feed.length ? (high.length ? high.length + " item" + (high.length > 1 ? "s" : "") + " need your attention." : "Nothing urgent. Everything reported in.") : "No briefs yet. Bots will appear here once they report.",
    priorities: high.map(h => [h.title, h.bot]), bots, feed, timeline: act, tasks: o.tasks,
    gauges: { online: bots.length ? Math.round(100 * (bots.length - quiet) / bots.length) : 0, tasks: o.tasks.length ? Math.round(100 * doneN / o.tasks.length) : 0, fresh },
  };
}

/* ---------- render ---------- */
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
function render(d) {
  const quiet = d.bots.filter(b => !b.healthy).length;
  $("sys").classList.toggle("warn", quiet > 0);
  $("sysTxt").textContent = quiet ? "System status: " + quiet + " bot" + (quiet > 1 ? "s" : "") + " quiet" : "System status: optimal";
  $("coreOrb").classList.toggle("warn", quiet > 0);
  $("coreLbl").textContent = quiet ? "ATTENTION" : "ONLINE";
  const h = new Date().getHours();
  $("greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("headline").textContent = d.headline;
  const prio = clear($("prio"));
  d.priorities.forEach((p, i) => { const r = el("div"); r.append(el("b", null, "0" + (i + 1)), el("span", null, p[0] + " ")); const s = el("span", null, "· " + p[1]); s.style.color = "var(--mute)"; r.append(s); prio.append(r); });

  const bl = clear($("botList"));
  d.bots.forEach(b => { const c = el("div", "bot"); const n = el("div", "n"); n.append(el("span", "dot" + (b.healthy ? "" : " off")), el("span", null, b.name));
    c.append(n, el("div", "m", "last report " + ago(b.last) + " · " + b.open + " task" + (b.open === 1 ? "" : "s")));
    if (b.tiles.length) { const t = el("div", "tiles"); b.tiles.forEach(x => { const r = el("div", "tile"); r.append(el("span", null, x[0]), el("b", x[2] || "", x[1])); t.append(r); }); c.append(t); }
    bl.append(c); });
  $("botSub").textContent = (d.bots.length - quiet) + "/" + d.bots.length + " online";
  $("navBots").textContent = d.bots.length;

  const fl = clear($("feedList"));
  if (!d.feed.length) fl.append(el("div", "empty", "Nothing in the last 24 hours."));
  d.feed.forEach(f => { const it = el("div", "item " + f.priority); it.append(el("div", "ic", f.priority === "alert" ? "!" : f.priority === "high" ? "▲" : "●"));
    const b = el("div"); b.append(el("div", "tt", f.title), el("div", "bd", f.body + " — " + f.bot)); it.append(b, el("div", "ag", ago(f.at))); fl.append(it); });
  $("feedSub").textContent = d.feed.length + " items";
  $("navBriefs").textContent = d.feed.length;

  const tl = clear($("tlList"));
  if (!d.timeline.length) tl.append(el("div", "empty", "Nothing yet today."));
  d.timeline.forEach(x => { const r = el("div", x.done ? "done" : ""); r.append(el("div", "tm", x.at), el("div", "tx", x.text), el("div", "nt", x.note)); tl.append(r); });

  const gs = clear($("gauges"));
  [["Bots online", d.gauges.online], ["Tasks done", d.gauges.tasks], ["Freshness", d.gauges.fresh]].forEach(([l, v]) => {
    const g = el("div", "g"), C = 2 * Math.PI * 34;
    g.innerHTML = '<svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" cx="40" cy="40" r="34" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - v / 100)).toFixed(1) + '"/></svg>';
    g.append(el("div", "v", v + "%"), el("div", "l", l)); gs.append(g); });

  const bars = clear($("barList")), counts = {}; d.feed.forEach(f => counts[f.bot] = (counts[f.bot] || 0) + 1);
  const mx = Math.max(1, ...d.bots.map(b => counts[b.name] || 0));
  d.bots.forEach(b => { const n = counts[b.name] || 0, r = el("div", "bar"), t = el("div", "tr"), f = el("div", "fl"); f.style.width = (100 * n / mx) + "%"; t.append(f);
    r.append(el("span", null, b.name), t, el("b", null, String(n))); bars.append(r); });
  const sel = $("cmdBot"), keep = sel.value; clear(sel); d.bots.forEach(b => sel.append(el("option", null, b.name))); if (keep) sel.value = keep;
  const tk = clear($("taskList")); const open = d.tasks.filter(t => t.status !== "done");
  if (!d.tasks.length) tk.append(el("div", "empty", "No tasks yet."));
  d.tasks.slice(0, 6).forEach(t => { const it = el("div", "item"); it.append(el("div", "ic", t.status === "done" ? "✓" : "…")); const b = el("div"); b.append(el("div", "tt", t.title), el("div", "bd", t.bot + " · " + t.status)); it.append(b, el("div")); tk.append(it); });
  $("taskSub").textContent = open.length + " open"; $("navTasks").textContent = open.length;
  $("foot").textContent = DEMO ? "demo mode" : "synced " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

/* ---------- plumbing ---------- */
async function api(path, opt = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opt });
  if (r.status === 401) throw new Error("auth");
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || j.detail || r.statusText); return j;
}
async function load() {
  try { render(DEMO ? demoData() : liveData(await api("/api/overview"))); $("login").style.display = "none"; if (!DEMO) $("signout").hidden = false; }
  catch (e) { if (e.message === "auth") $("login").style.display = "grid"; else $("headline").textContent = "Error: " + e.message; }
}
function tick() { const n = new Date(); $("clk").textContent = n.toLocaleTimeString([], { hour12: false });
  $("dt").textContent = n.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
$("demoChip").hidden = !DEMO;
$("loginForm").addEventListener("submit", async e => { e.preventDefault(); try { await api("/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) }); $("pw").value = ""; load(); } catch (x) { $("loginMsg").textContent = x.message; } });
$("signout").addEventListener("click", async () => { await api("/logout", { method: "POST" }); load(); });
$("refresh").addEventListener("click", load);
$("cmd").addEventListener("submit", async e => { e.preventDefault(); const m = $("cmdMsg");
  if (DEMO) { m.textContent = "Demo mode: nothing was sent."; return; }
  try { const r = await api("/api/tasks", { method: "POST", body: JSON.stringify({ bot: $("cmdBot").value, title: $("cmdTitle").value, detail: $("cmdDetail").value }) });
    m.textContent = "Sent · " + r.wake_status; $("cmdTitle").value = ""; $("cmdDetail").value = ""; load(); } catch (x) { m.textContent = x.message; } });
tick(); setInterval(tick, 1000); load();
setInterval(() => { if (document.visibilityState === "visible" && !DEMO && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) load(); }, 60000);
</script>
